name: Deploy Web Installer to GitHub Pages

on:
  push:
    branches:
      - main
    paths:
      - "installer/**"
      - ".github/workflows/deploy-pages.yml"
      - "scripts/stage-published-installer.mjs"
      - "scripts/validate-installer.mjs"
      - "scripts/firmware-release.mjs"
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    if: github.repository == 'Kenblair1226/esp32-gt7-dashboard' && (github.event_name != 'release' || (!github.event.release.prerelease && !github.event.release.draft))
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: Kenblair1226/esp32-gt7-dashboard
    steps:
      - name: Check out the current installer frontend
        uses: actions/checkout@v6
        with:
          ref: main
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Stage and validate the current published firmware
        run: node scripts/stage-published-installer.mjs stage installer .pio/pages-site .pio/pages-release.json

      - name: Upload installer site
        uses: actions/upload-pages-artifact@v4
        with:
          path: .pio/pages-site

      - name: Recheck the stable release immediately before deployment
        run: node scripts/stage-published-installer.mjs check-current .pio/pages-release.json

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
